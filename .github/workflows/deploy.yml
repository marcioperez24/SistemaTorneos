name: Deploy SistemaTorneos

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sistema-torneos
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas y Validación CI
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'
            cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Verificación del Sistema
        run: python manage.py check

      - name: Ejecutar Pruebas Unitarias
        run: python manage.py test

  deploy:
    name: Despliegue en Servidor VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Despliegue en VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/marcio/apps/SistemaTorneos

            # Desplegar cambios limpios usando git pull fast-forward
            git fetch origin main
            git pull --ff-only origin main

            source .venv/bin/activate

            pip install -r requirements.txt

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart systorneos
            sudo systemctl reload nginx

            # Verificación de Estado (Health Check)
            curl -f -s http://127.0.0.1:8000/health/ || (echo "Health check falló después del despliegue!" && exit 1)